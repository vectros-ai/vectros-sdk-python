# =============================================================================
# Vectros AI Platform Python SDK — pyproject.toml
#
# The package source under `vectros/` is generated from the Vectros OpenAPI specification;
# this file is its build definition. `0.48.0` is replaced with the release version when
# the package is built.
# =============================================================================

[build-system]
# setuptools>=77 is required for the PEP 639 license expression (`license = "Apache-2.0"`).
# The deprecated `license = {text = "..."}` table form works back to setuptools 61 but is sunset
# on 2027-02-18. setuptools>=77 also includes the LICENSE file in the sdist and wheel through the
# PEP 639 `license-files` default glob (`LICEN[CS]E*`), so it needs no explicit declaration.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectros"
version = "0.48.0"
description = "Vectros AI Platform SDK — hybrid search, document ingestion, structured records, and inference for your application."
readme = "README.md"
requires-python = ">=3.8"
# PEP 639 SPDX expression (NOT the deprecated `license = {text = "..."}` form).
# The matching License :: OSI Approved classifier is also deprecated under
# PEP 639 — omitted from classifiers below for the same reason.
license = "Apache-2.0"
authors = [{name = "Vectros AI", email = "support@vectros.ai"}]
keywords = ["vectros", "ai", "rag", "search", "vector-database", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # httpx upper bound: the generated `core/http_client.py` imports
    # `from httpx._types import RequestFiles`. `httpx._types` is a private module that httpx
    # removed in 0.28 (the public surface moved to `httpx.types`); without the upper bound,
    # importing the SDK fails with `ModuleNotFoundError: No module named 'httpx._types'`.
    # Re-evaluate when the generated code imports from the public `httpx.types`.
    "httpx>=0.21.2,<0.28",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

[project.urls]
Homepage = "https://vectros.ai"
Documentation = "https://docs.vectros.ai"
Repository = "https://github.com/vectros-ai/vectros-sdk-python"

# The package source lives under `vectros/`.
# `find` discovers it and any subpackages (vectros.auth, vectros.core, etc).
[tool.setuptools.packages.find]
where = ["."]
include = ["vectros*"]
exclude = ["tests*"]
